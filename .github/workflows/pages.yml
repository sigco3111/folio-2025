name: Korean static build and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['readme.md', 'README.en.md']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node localize.mjs
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Save translated sources
        run: |
          git config user.name 'sigco3111'
          git config user.email 'sigco3111@users.noreply.github.com'
          git add sources vite.config.js readme.md README.en.md
          git diff --cached --quiet || (git commit -m 'Apply Korean static edition [skip ci]' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
